application:
  _target_: mairl_exp.applications.toy.ToyApplication
  eta: 1.25
  leader_reward:
  - - 0.1
    - 0.9
    - 0.3
    - -0.2
  - - 0.7
    - -0.1
    - 0.5
    - 0.2
  - - -0.2
    - 0.4
    - 0.8
    - 0.6
  problem_seed: 17
  radius: 2.0
  true_omega:
  - 0.55
  - -0.65
  - 0.35
experiment:
  _target_: mairl_exp.calibration.NumericalCalibrationStudy
  calibration_seed_count: 5
  calibration_seed_start: 1000
  candidates:
  - _target_: mairl_exp.calibration.NumericalCandidate
    active_policy:
      _target_: mairl.exploration.simplex.PolicyOptimizationConfig
      grid_batch_size: 4096
      grid_max_points: 250000
      grid_resolution: 80
      max_iterations: 1000
      method: multistart
      projected_gradient_tolerance: 1.0e-06
      random_starts: 8
      refine_grid_solution: true
      tolerance: 1.0e-09
    mle:
      _target_: mairl.inference.mle.MLEConfig
      constraint_tolerance: 1.0e-09
      max_iterations: 1000
      objective_tolerance: 1.0e-13
      projected_gradient_tolerance: 1.0e-06
      ridge: 0.0001
      solver: newton
      trust_region_gradient_tolerance: 1.0e-08
      trust_region_step_tolerance: 1.0e-12
    name: default_newton
    warmup:
      _target_: mairl_exp.config.WarmupNumerics
      design_tolerance: 0.15
      line_search_max_iterations: 500
      line_search_tolerance: 1.0e-12
      matrix_tolerance: 1.0e-09
      max_iterations: 10000
      support_tolerance: 1.0e-12
  - _target_: mairl_exp.calibration.NumericalCandidate
    active_policy:
      _target_: mairl.exploration.simplex.PolicyOptimizationConfig
      grid_batch_size: 4096
      grid_max_points: 250000
      grid_resolution: 80
      max_iterations: 1000
      method: multistart
      projected_gradient_tolerance: 1.0e-06
      random_starts: 8
      refine_grid_solution: true
      tolerance: 1.0e-09
    mle:
      _target_: mairl.inference.mle.MLEConfig
      constraint_tolerance: 1.0e-09
      max_iterations: 1000
      objective_tolerance: 1.0e-13
      projected_gradient_tolerance: 1.0e-06
      ridge: 0.0001
      solver: slsqp
      trust_region_gradient_tolerance: 1.0e-08
      trust_region_step_tolerance: 1.0e-12
    name: direct_slsqp_reference
    warmup:
      _target_: mairl_exp.config.WarmupNumerics
      design_tolerance: 0.15
      line_search_max_iterations: 500
      line_search_tolerance: 1.0e-12
      matrix_tolerance: 1.0e-09
      max_iterations: 10000
      support_tolerance: 1.0e-12
  confidence_delta: 0.05
  evaluation_interval: 10
  guardrails:
    _target_: mairl_exp.calibration.CalibrationGuardrails
    max_mle_reference_gap: 1.0e-06
    max_mle_residual: 1.0e-06
    max_policy_reference_gap: 1.0e-06
    max_policy_residual: 1.0e-06
    minimum_seeds_per_split: 5
    reference_mle:
      _target_: mairl.inference.mle.MLEConfig
      constraint_tolerance: 1.0e-09
      max_iterations: 1000
      objective_tolerance: 1.0e-13
      projected_gradient_tolerance: 1.0e-06
      ridge: 0.0001
      solver: slsqp
      trust_region_gradient_tolerance: 1.0e-08
      trust_region_step_tolerance: 1.0e-12
    reference_policy:
      _target_: mairl.exploration.simplex.PolicyOptimizationConfig
      grid_batch_size: 4096
      grid_max_points: 250000
      grid_resolution: 80
      max_iterations: 1000
      method: grid
      projected_gradient_tolerance: 1.0e-06
      random_starts: 0
      refine_grid_solution: true
      tolerance: 1.0e-12
    reject_numeric_boundary: true
  lambda_information_multiplier: 1.0
  lambda_warm: 0.01
  name: numerical-calibration
  total_samples: 180
  validation_seed_count: 5
  validation_seed_start: 2000
  warmup_budget: 120
  warmup_enabled: true
numerics:
  _target_: mairl_exp.config.ExperimentNumerics
  active_policy:
    _target_: mairl.exploration.simplex.PolicyOptimizationConfig
    grid_batch_size: 4096
    grid_max_points: 250000
    grid_resolution: 80
    max_iterations: 1000
    method: multistart
    projected_gradient_tolerance: 1.0e-06
    random_starts: 8
    refine_grid_solution: true
    tolerance: 1.0e-09
  evaluation_policy:
