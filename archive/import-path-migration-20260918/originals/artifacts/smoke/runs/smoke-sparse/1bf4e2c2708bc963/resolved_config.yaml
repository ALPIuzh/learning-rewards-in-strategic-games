application:
  _target_: experiments.sparse_information.application.SparseInformationApplication
  eta: 2.0
  leader_actions: 16
  radius: 2.0
  safe_payoff: 0.75
  true_omega: 1.0
experiment:
  _target_: mairl_exp.studies.BaselineComparisonStudy
  confidence_delta: 0.05
  evaluation_interval: 4
  lambda_information_multiplier: 4.0
  lambda_warm: 0.01
  methods:
  - active
  - fixed_random
  - random_each_round
  name: smoke-sparse
  seed_count: 2
  seed_start: 100
  total_samples: 8
  warmup_budget: 0
  warmup_modes:
  - false
numerics:
  _target_: mairl_exp.config.ExperimentNumerics
  active_policy:
    _target_: mairl.exploration.simplex.PolicyOptimizationConfig
    batch_prefilter_iterations: 4
    batch_refine_starts: 1
    grid_batch_size: 4096
    grid_max_points: 250000
    grid_resolution: 80
    max_iterations: 1000
    method: multistart
    projected_gradient_tolerance: 1.0e-06
    random_starts: 8
    refine_grid_solution: true
    tolerance: 1.0e-09
  evaluation_policy:
    _target_: mairl.exploration.simplex.PolicyOptimizationConfig
    grid_batch_size: 4096
    grid_max_points: 100000
    grid_resolution: 40
    max_iterations: 1000
    method: multistart
    projected_gradient_tolerance: 1.0e-06
    random_starts: 0
    refine_grid_solution: true
    tolerance: 1.0e-12
  mle:
    _target_: mairl.inference.mle.MLEConfig
    constraint_tolerance: 1.0e-09
    kkt_tolerance: 1.0e-09
    max_iterations: 1000
    objective_tolerance: 1.0e-13
    projected_gradient_tolerance: 1.0e-06
    ridge: 0.0001
    solver: newton
    trust_region_barrier_tolerance: 1.0e-12
    trust_region_gradient_tolerance: 1.0e-12
    trust_region_step_tolerance: 1.0e-14
  warmup:
    _target_: mairl_exp.config.WarmupNumerics
    design_tolerance: 0.15
    line_search_max_iterations: 500
    line_search_tolerance: 1.0e-12
    matrix_tolerance: 1.0e-09
    max_iterations: 10000
    support_tolerance: 1.0e-12
run:
  require_clean_git: false
  resume: true
  root: /Users/antoine/GitHub/Research/mairl-iclr/artifacts/smoke/runs
  seed_batch_size: 64
schema_version: 1
