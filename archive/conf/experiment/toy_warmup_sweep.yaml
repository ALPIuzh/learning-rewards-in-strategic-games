_target_: mairl_exp.warmup_sweep.WarmupSweepStudy

name: toy-warmup-sweep
seed_start: 100
seed_count: 100
total_samples: 1000

# Budgets 0 and 120 are intentionally absent: the plot reuses the existing
# 100-seed baseline-comparison run for those two points.
warmup_budgets:
  - 24
  - 60
  - 240
  - 500
  - 800
  - 1000

evaluation_interval: 25
lambda_information_multiplier: 1.0
lambda_warm: 0.01
confidence_delta: 0.05

methods:
  - active
  - fixed_random
  - random_each_round
