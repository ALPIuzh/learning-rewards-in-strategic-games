# @package experiment

_target_: mairl_exp.studies.discovery.JointWarmupLambdaDiscoveryStudy

name: guard-lobeke-joint-expansion
seed_start: 40000
seed_count: 32
minimum_seed_count: 16

final_evaluation_seed_start: 100
final_evaluation_seed_count: 50

total_samples: 1600
warmup_budgets: [100, 400, 600, 800]
lambda_information_multipliers: [1.0, 8.0, 16.0, 32.0]

# Re-evaluate the original reference so this sparse expansion remains self-contained.
reference_warmup_budget: 100
reference_multiplier: 1.0
candidate_pairs:
  - [100, 1.0]
  - [400, 32.0]
  - [600, 8.0]
  - [600, 16.0]
  - [600, 32.0]
  - [800, 8.0]
  - [800, 16.0]
  - [800, 32.0]

lambda_warm: 0.01
confidence_delta: 0.05
evaluation_interval: 1600
tuning_metric: stackelberg_suboptimality
guardrail_metric: fisher_transfer_error
guardrail_standard_errors: 2.0
shortlist_standard_errors: 1.0
